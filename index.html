<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComplainX</title>
    <meta name="description" content="A community problem reporting and resolution tracking portal for civic utilities and infrastructure." />
    <meta property="og:title" content="ComplainX" />
    <meta property="og:description" content="A community problem reporting and resolution tracking portal for civic utilities and infrastructure." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global captured error:', e.error || e.message);
        var r = document.getElementById('root');
        if (r && (!r.childNodes.length || r.innerHTML.indexOf('cx-spin') !== -1)) {
          var details = e.message || 'Script error occurred while loading application modules';
          r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:system-ui,sans-serif;padding:20px;"><div style="max-width:480px;background:#1e293b;padding:28px;border-radius:16px;text-align:center;border:1px solid #334155;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);"><div style="font-size:36px;margin-bottom:12px;">⚠️</div><h2 style="color:#f87171;font-size:20px;font-weight:700;margin:0 0 10px 0;">Portal Load Notice</h2><p style="color:#94a3b8;font-size:13px;line-height:1.5;margin:0 0 20px 0;word-break:break-word;">' + details + '</p><div style="display:flex;gap:10px;justify-content:center;"><button onclick="window.location.reload();" style="background:#2563eb;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Reload</button><button onclick="try{localStorage.clear();sessionStorage.clear();}catch(ex){};window.location.href=\'/\';" style="background:#334155;color:#e2e8f0;border:1px solid #475569;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Reset Cache</button></div></div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; padding: 24px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #2563eb; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 24px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.25);">
          CX
        </div>
        <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 8px 0; color: #0f172a;">ComplainX</h1>
        <p style="font-size: 14px; color: #64748b; margin: 0 0 24px 0; max-width: 320px;">Civic Grievance & Utility Tracking Portal</p>
        <div style="width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: cx-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes cx-spin { to { transform: rotate(360deg); } }
        </style>
        <noscript>
          <p style="margin-top: 20px; color: #ef4444; font-size: 14px;">JavaScript is required to use this portal.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
